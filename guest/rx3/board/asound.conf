# RX3 fixed ALSA device names, on emulated playback and silent line inputs.
# The stock application opens hw:cs4344audiorev8,0..2 for duplex PCM and
# hw:esaics4344audio,0 for AUX input. Preserve those names through ALSA's
# configuration interface. Explicit "type hw" nodes avoid recursion here.
pcm.rx3_out0 { type hw card vsnd device 0 }
pcm.rx3_out1 { type hw card vsnd_1 device 0 }
pcm.rx3_out2 { type hw card vsnd_2 device 0 }
pcm.!hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default "cs4344audiorev8" }
    @args.DEV { type integer default 0 }
    @args.SUBDEV { type integer default -1 }
    type asym
    playback.pcm { @func concat strings [ "rx3_out" $DEV ] }
    capture.pcm { type hw card Dummy device 0 }
}
ctl.!hw {
    @args [ CARD ]
    @args.CARD { type string default "cs4344audiorev8" }
    type hw
    card Dummy
}
